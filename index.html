<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vijay Game</title>
<style>
body{background:#0f0f0f;color:white;font-family:Arial;padding:10px}
.card{background:#1e1e1e;padding:15px;border-radius:12px;margin:10px 0}
button{padding:12px;border:none;border-radius:10px;background:#ff6600;color:white;font-weight:bold;margin:5px;width:100%}
.btn-green{background:#00c853}.btn-blue{background:#2962ff}
input{padding:12px;width:92%;border-radius:10px;border:none;margin:5px 0;background:#333;color:white}
.hidden{display:none}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.4) rotate(5deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px) rotate(-5deg)}75%{transform:translateX(10px) rotate(5deg)}}
@keyframes blast{0%{transform:scale(0)}50%{transform:scale(1.6)}100%{transform:scale(1)}}
.meme-big{animation:bounce .5s ease}.meme-shake{animation:shake .5s ease}.meme-blast{animation:blast .6s ease}
</style></head><body>
<h2 style="text-align:center">🔥 VIJAY GAME 🔥</h2>

<div id="authScreen" class="card">
<h3>Welcome Mama!</h3>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button class="btn-green" onclick="doRegister()">📝 REGISTER - Kotha User</button>
<button class="btn-blue" onclick="doLogin()">🔐 LOGIN - Old User</button>
<p id="authMsg" style="color:#ffcc00;text-align:center;font-weight:bold"></p>
<p style="text-align:center;color:#aaa;font-size:12px">Kotha vaadivi aythe REGISTER kottu<br>Old vaadivi aythe LOGIN kottu</p>
</div>

<div id="mainScreen" class="hidden">
<div class="card"><h3>Hi <span id="myName"></span>! 🔥 Best: <span id="myBest">0</span></h3>
<button onclick="showGame()">🎮 Click Game</button>
<button onclick="showRooms()">🏠 Rooms</button>
<button onclick="showChat()">💬 Chat</button>
<button onclick="showBoard()">🏆 Leaderboard</button>
<button onclick="logout()" style="background:#666">Logout</button></div>

<div id="gameScreen" class="card hidden">
<h3>Click Game - 10 Sec</h3>
<p>Score: <span id="score">0</span> | Time: <span id="time">10s</span> | Best: <span id="best">0</span></p>
<div id="memeBox" style="font-size:90px;text-align:center;height:100px">😎</div>
<div id="memeText" style="text-align:center;color:#ffcc00;font-weight:900;font-size:22px;min-height:30px">Ready ah?</div>
<div id="commentBox" style="text-align:center;color:#00ffcc;font-weight:bold;font-size:16px;min-height:25px">Click kottu mama!</div>
<button onclick="clickMe()" style="padding:20px;font-size:20px;background:#ff6600">CLICK ME! 👆</button>
<button onclick="startGame()">Start Game</button>
<p id="result" style="text-align:center;color:#4CAF50;font-weight:bold"></p></div>

<div id="roomsScreen" class="card hidden"><h3>Rooms</h3><input id="roomName" placeholder="Room peru"><button onclick="createRoom()">Create Room</button><div id="roomList"></div></div>
<div id="chatScreen" class="card hidden"><h3>Chat</h3><div id="chatBox" style="height:150px;overflow:auto;background:#111;padding:10px;border-radius:10px"></div><input id="chatMsg" placeholder="Message..."><button onclick="sendChat()">Send</button></div>
<div id="boardScreen" class="card hidden"><h3>Leaderboard</h3><div id="boardList"></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
var firebaseConfig={apiKey:"AIzaSyB-EXAMPLE",authDomain:"vijiraiya-game-art.firebaseapp.com",databaseURL:"https://vijiraiya-game-art-default-rtdb.firebaseio.com",projectId:"vijiraiya-game-art",storageBucket:"vijiraiya-game-art.appspot.com",messagingSenderId:"123456789",appId:"1:123456789:web:example"};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();
var currentUser="",myData={best:0,games:0};
var score=0,timeLeft=10,timer=null,playing=false;

function getUP(){ return {u:document.getElementById('username').value.trim(), p:document.getElementById('password').value.trim()} }
function msg(t){ document.getElementById('authMsg').innerText=t; }

// REGISTER - Kotha user kosam
function doRegister(){
  var d=getUP(); if(!d.u||!d.p) return msg('Username + Password pettu mama!');
  db.ref('users/'+d.u).once('value',s=>{
    if(s.exists()){ msg('⚠️ Ee username already undhi mama! LOGIN kottu, leda vere peru pettu!'); }
    else{
      db.ref('users/'+d.u).set({username:d.u,password:d.p,best:0,games:0});
      msg('✅ Register ayipoyindhi mama! Ippudu LOGIN kottu!');
      document.getElementById('password').value='';
    }
  });
}

// LOGIN - Old user kosam
function doLogin(){
  var d=getUP(); if(!d.u||!d.p) return msg('Username + Password pettu mama!');
  db.ref('users/'+d.u).once('value',s=>{
    if(!s.exists()){ msg('❌ Ee username ledhu mama! Mundhu REGISTER kottu!'); return; }
    var data=s.val();
    if(data.password!==d.p){ msg('❌ Wrong Password mama! Correct password kottu!'); return; }
    // LOGIN SUCCESS
    currentUser=d.u; myData=data;
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('mainScreen').classList.remove('hidden');
    document.getElementById('myName').innerText=d.u;
    document.getElementById('myBest').innerText=myData.best||0;
    document.getElementById('best').innerText=myData.best||0;
    loadChat(); loadRooms(); loadBoard();
  });
}
function logout(){ location.reload(); }
function hideAll(){['gameScreen','roomsScreen','chatScreen','boardScreen'].forEach(id=>document.getElementById(id).classList.add('hidden'))}
function showGame(){hideAll();document.getElementById('gameScreen').classList.remove('hidden')}
function showRooms(){hideAll();document.getElementById('roomsScreen').classList.remove('hidden')}
function showChat(){hideAll();document.getElementById('chatScreen').classList.remove('hidden')}
function showBoard(){hideAll();document.getElementById('boardScreen').classList.remove('hidden')}
function showMeme(emoji,text,comment,anim){
  var box=document.getElementById('memeBox'); box.innerText=emoji; box.className=''; void box.offsetWidth; box.classList.add(anim);
  document.getElementById('memeText').innerText=text;
  document.getElementById('commentBox').innerText=comment;
}
function startGame(){
  score=0;timeLeft=10;playing=true;
  document.getElementById('score').innerText=0;document.getElementById('time').innerText='10s';document.getElementById('result').innerText='';
  showMeme('😎','Ready ah?','Kottu mama!','meme-big');
  clearInterval(timer);
  timer=setInterval(()=>{
    timeLeft--;document.getElementById('time').innerText=timeLeft+'s';
    if(timeLeft<=0){
      clearInterval(timer);playing=false;
      var oldBest=myData.best||0; var newBest=Math.max(oldBest,score);
      db.ref('users/'+currentUser).update({best:newBest,games:(myData.games||0)+1});
      myData.best=newBest; document.getElementById('myBest').innerText=newBest;
      if(score>oldBest && score>0){
        showMeme('👑','ABHAA!!','Top Score kottesav mama! Nuvve King!','meme-blast');
        document.getElementById('result').innerText='🔥 NEW TOP SCORE! '+score+' - Abhaa mama!';
      }else{
        showMeme('😏','Ravatledhaa?','Inka try chey mama, nuvvu cheyagalavu!','meme-shake');
        document.getElementById('result').innerText='Game Over! Score: '+score+' | Best: '+oldBest;
      }
    }
  },1000);
}
function clickMe(){
  if(!playing) return alert('Mundhu Start Game kottu mama!');
  score++;document.getElementById('score').innerText=score;
  if(score===10) showMeme('😲','WOWW!!','10 ayipoyindhi mama! Super!','meme-big');
  else if(score===20) showMeme('💪','CAMON!!','20 vachesindhi! Aapu mama!','meme-big');
  else if(score===30) showMeme('⚡','SPEED!!','30! Inka fast!','meme-big');
  else if(score===40) showMeme('🦁','SIMHAM!!','40! Evaru aapaleru!','meme-big');
  else if(score===50) showMeme('🔥','KOTTU KOTTU!!','50!! Aarey mass mama! Aapaku!','meme-blast');
  else{ var n=['😎','😜','🤩','😁']; document.getElementById('memeBox').innerText=n[Math.floor(Math.random()*n.length)]; document.getElementById('commentBox').innerText='Score: '+score+' - Kottu mama!'; }
}
function createRoom(){var r=document.getElementById('roomName').value.trim(); if(!r) return; db.ref('rooms/'+r).set({createdBy:currentUser,time:Date.now()}); alert('Room created mama!');}
function loadRooms(){db.ref('rooms').on('value',s=>{var h='';s.forEach(c=>{h+='<div style="padding:10px;background:#333;margin:5px;border-radius:8px">🏠 '+c.key+' - by '+c.val().createdBy+'</div>'});document.getElementById('roomList').innerHTML=h||'No rooms';});}
function sendChat(){var m=document.getElementById('chatMsg').value.trim(); if(!m) return; db.ref('chat').push({user:currentUser,msg:m,time:Date.now()}); document.getElementById('chatMsg').value='';}
function loadChat(){db.ref('chat').limitToLast(20).on('value',s=>{var h='';s.forEach(c=>{var v=c.val();h+='<div><b>'+v.user+':</b> '+v.msg+'</div>'});var b=document.getElementById('chatBox');b.innerHTML=h;b.scrollTop=b.scrollHeight;});}
function loadBoard(){db.ref('users').orderByChild('best').limitToLast(10).on('value',s=>{var arr=[];s.forEach(c=>arr.push(c.val()));arr.reverse();var h='';arr.forEach((u,i)=>{h+='<div style="padding:8px;background:#333;margin:3px;border-radius:8px">'+(i+1)+'. '+u.username+' - '+u.best+'</div>'});document.getElementById('boardList').innerHTML=h;});}
</script></body></html>
